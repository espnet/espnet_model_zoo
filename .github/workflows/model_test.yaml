name: Model test

# Downloads and runs every valid ASR, streaming ASR and TTS model in table.csv
# - tens of gigabytes and hours - so it is not a pull-request gate. Run it by
# hand from the Actions tab, or let the weekly run catch models that broke.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        espnet-version: ["git+https://github.com/espnet/espnet.git"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The action hashes requirements.txt or pyproject.toml by default;
          # this package declares its dependencies in setup.py.
          cache-dependency-path: setup.py
      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y cmake libsndfile1 bc
      - name: install espnet
        env:
          ESPNET_VERSION: ${{ matrix.espnet-version }}
        run: |
          pip install -U pip setuptools wheel
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "${ESPNET_VERSION}"
          pip install ".[test]"
      - name: install pyopenjtalk
        run: |
          mkdir pyopenjtalk
          cd pyopenjtalk
          wget https://raw.githubusercontent.com/espnet/espnet/master/tools/installers/install_pyopenjtalk.sh
          chmod +x install_pyopenjtalk.sh
          ./install_pyopenjtalk.sh
      - name: test model
        run: |
          export LD_LIBRARY_PATH=$(pwd)/pyopenjtalk/lib:${LD_LIBRARY_PATH}
          pytest ./ci/test_model.py
