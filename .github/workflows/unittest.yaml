name: Unitest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linter_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # espnet requires Python >=3.12,<3.14; test the released package and master.
        python-version: ["3.12"]
        espnet-version: ["espnet", "git+https://github.com/espnet/espnet.git"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The action hashes requirements.txt or pyproject.toml by default;
          # this package declares its dependencies in setup.py.
          cache-dependency-path: setup.py
      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libsndfile1
      - name: install
        env:
          ESPNET_VERSION: ${{ matrix.espnet-version }}
        run: |
          pip install -U pip setuptools wheel
          # CPU wheels: the default index resolves torch to the CUDA build,
          # several GB that a test of a downloader has no use for.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "${ESPNET_VERSION}"
          pip install ".[test]"
      - name: test python
        run: |
          ./ci/test_python.sh
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
