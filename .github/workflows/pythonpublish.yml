# Builds the sdist and wheel and uploads them to PyPI when a v* tag is pushed.
#
# Uploads use PyPI's trusted publishing: the job presents a GitHub OIDC token
# and PyPI checks it against a publisher registered for the project
# (repository espnet/espnet_model_zoo, workflow pythonpublish.yml). PyPI
# stopped accepting username/password uploads in 2024, so the PYPI_USERNAME
# and PYPI_PASSWORD secrets this workflow used until now cannot publish
# anything. Register the publisher once at
# https://pypi.org/manage/project/espnet-model-zoo/settings/publishing/
# before the first tag.

name: Upload Python Package

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
