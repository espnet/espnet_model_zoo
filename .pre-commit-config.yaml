# The pre-commit.ci app is installed on this repository; without this file it
# fails every pull request with ".pre-commit-config.yaml is not a file". Same
# hooks and versions as espnet/espnet.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black

-   repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
    -   id: isort
